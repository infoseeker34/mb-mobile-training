name: Deploy Mobile Web to S3/CloudFront

# Hosts the Expo web export of the mobile app on its own S3 + CloudFront
# (provisioned by mb-cloud-services infrastructure/main.tf module "mobile_web").
# The native app is unaffected — this only publishes the web build.

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/deploy-static.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="dev"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT

  build-and-deploy:
    name: Build and Deploy to S3/CloudFront
    runs-on: ubuntu-latest
    needs: determine-environment
    environment: ${{ needs.determine-environment.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve backend API URL
        id: get-api-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name mb-cloud-services-${{ needs.determine-environment.outputs.environment }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ServiceEndpoint`].OutputValue' \
            --output text)
          if [ -z "$API_URL" ]; then
            echo "❌ Could not find the API stack. Deploy the backend first."
            exit 1
          fi
          # BARE ServiceEndpoint (no /api) — apiClient.js prepends `/api` on
          # every call (baseURL: API_BASE_URL). This differs from the admin
          # portal, whose client omits the prefix so its URL includes /api.
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

      - name: Build (Expo web export)
        env:
          # Inlined into the web bundle at export time (EXPO_PUBLIC_* prefix).
          EXPO_PUBLIC_API_URL: ${{ steps.get-api-url.outputs.api_url }}
        run: npx expo export --platform web --output-dir dist

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ secrets.STATIC_SITE_BUCKET }}" --delete

      - name: Check CloudFront config
        id: cf-check
        run: |
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            echo "has-cloudfront=true" >> $GITHUB_OUTPUT
          else
            echo "has-cloudfront=false" >> $GITHUB_OUTPUT
          fi

      - name: Invalidate CloudFront cache
        if: steps.cf-check.outputs.has-cloudfront == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Determine site URL + smoke test
        if: steps.cf-check.outputs.has-cloudfront == 'true'
        run: |
          DOMAIN=$(aws cloudfront get-distribution \
            --id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --query 'Distribution.DomainName' --output text)
          BASE_URL="https://$DOMAIN"
          echo "🚀 Mobile web deployed to: $BASE_URL"

          PASS=true
          echo "--- / (expect 200) ---"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/")" == "200" ] \
            && echo "PASS: root serves app" || { echo "FAIL: root"; PASS=false; }
          echo "--- /some/client/route (SPA fallback, expect 200) ---"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/some/client/route")" == "200" ] \
            && echo "PASS: SPA fallback" || { echo "FAIL: SPA fallback"; PASS=false; }
          echo "--- security headers ---"
          HEADERS=$(curl -sI "$BASE_URL/")
          echo "$HEADERS" | grep -qi "strict-transport-security" \
            && echo "PASS: HSTS" || { echo "FAIL: HSTS missing"; PASS=false; }

          [ "$PASS" == "true" ] || { echo "Smoke tests failed"; exit 1; }
          echo "All smoke tests passed"

      - name: Note (no CloudFront yet)
        if: steps.cf-check.outputs.has-cloudfront != 'true'
        run: |
          echo "Synced to S3, but CLOUDFRONT_DISTRIBUTION_ID is not set — set it"
          echo "(and STATIC_SITE_BUCKET) so CloudFront serves + invalidates."
